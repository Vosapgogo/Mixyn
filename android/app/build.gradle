plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.mixyn.app'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.mixyn.app'
        minSdk = 26
        // 36, not 37: Android 17 blocks apps targeting 37 from reaching the local network (the laptop
        // backend at 10.0.2.2) unless they request a runtime permission. Not worth it for this PoC.
        targetSdk = 36
        versionCode = 1
        versionName = '0.1'
        // The emulator reaches the laptop's localhost at 10.0.2.2.
        buildConfigField 'String', 'API_BASE_URL', '"http://10.0.2.2:8080/"'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.12.4'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.squareup.retrofit2:retrofit:2.12.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.12.0'
}
